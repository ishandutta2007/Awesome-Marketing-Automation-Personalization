<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Gradient for Title / Accents -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 260px; }
    .card-float-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 7s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 6; animation: flowDash 3s linear infinite; }
    .status-shimmer { animation: shimmer 2s ease-in-out infinite; }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Background Animated Atmospheric Orbs (staying in background) -->
  <circle class="orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="270" r="160" fill="#818cf8" filter="url(#glow)" />
  <circle cx="600" cy="180" r="120" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Tech Grid Accent Lines -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Connecting Data Flow Pipes (Background layer) -->
  <path class="flow-line" d="M 80 180 C 220 180, 260 90, 420 90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
  <path class="flow-line" d="M 780 270 C 920 270, 960 180, 1120 180" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.5" />

  <!-- Ambient Dynamic Floating Tech Badges (Side Wings - Non-overlapping) -->
  <g class="card-float-1" transform="translate(60, 42)">
    <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" class="status-shimmer" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">MULTI-CHANNEL CDP</text>
  </g>

  <g class="card-float-2" transform="translate(60, 282)">
    <rect width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#818cf8" class="status-shimmer" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">DYNAMIC JOURNEYS</text>
  </g>

  <g class="card-float-2" transform="translate(950, 42)">
    <rect width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#c084fc" class="status-shimmer" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">AI HYPER-PERSONAL</text>
  </g>

  <g class="card-float-1" transform="translate(950, 282)">
    <rect width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#fb7185" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="18" cy="17" r="4.5" fill="#fb7185" class="status-shimmer" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">OPEN-SOURCE + SAAS</text>
  </g>

  <!-- FOREGROUND: High Contrast, Sharp Title & Subtitles -->
  <!-- Top Category Chip -->
  <g transform="translate(485, 46)">
    <rect width="230" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="url(#titleGrad)" stroke-width="1.2" />
    <text x="115" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle" fill="url(#titleGrad)" letter-spacing="-0.8">
    Marketing Automation &amp; Personalization
  </text>

  <!-- High-Readability Subtitle in Foreground -->
  <text x="600" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#94a3b8" letter-spacing="0.2">
    Enterprise SaaS Clouds, Open-Source Stacks, CDPs &amp; Real-Time Customer Engagement
  </text>

  <!-- Feature Metric Pills Bar in Center Foreground -->
  <g transform="translate(325, 222)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="80" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">🎯 Journey Builders</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="160" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="275" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">⚡ Real-Time CDPs</text>

    <!-- Pill 3 -->
    <rect x="390" y="0" width="160" height="38" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="470" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">🔒 Self-Hosted Privacy</text>
  </g>
</svg>
